domain: help_seeking_directed_at_study_team
title: Help-Seeking Directed at the Study Team
tier:
  type: score
  instructions: |
    Rate the entry for help-seeking directed at the study team. Use the tier definitions and examples below. Participant age and entry date are in the state.
    <reading_rules>
  criteria:
    - |
      Green: Neutral comments about the app or study.
      Examples:
      - "Writing in this journal helps me think."
    - |
      Yellow: Questions about whether anyone reads entries; requests for contact, advice, or help from the study team; statements that the participant hopes or expects someone will respond. Never Green, even without other risk content.
      Examples:
      - "Is anyone actually reading this?"
      - "I hope someone sees this."
      - "Can someone from the study talk to me?"
    - |
      Red: Help-seeking that co-occurs with Red-level content in any domain; urgent requests for help.
      Examples:
      - "Please, someone call me, I am not safe."
timing_guidance: |
  Green: Neutral or positive comments about the study or app.
  Yellow: Any help-seeking or expectation of response, at the time of writing.
  Red: Urgent help-seeking co-occurring with Red-level risk content at the time of writing.
